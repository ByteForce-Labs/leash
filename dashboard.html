<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leash</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e4e0;
    --ok: #1f8a5b; --bad: #c92a2a; --warn: #b35c00; --info: #3b5bdb; --track: #ececea;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1e1e1c; --ink: #ecece8; --muted: #9a9a94; --line: #2e2e2b;
            --ok: #4cc38a; --bad: #ff6b6b; --warn: #f0a04b; --info: #7c95f5; --track: #2a2a27; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); }
  .gw { margin-left: auto; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 8px; }
  .card.leashed { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-weight: 650; font-size: 16px; }
  .pill { padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .pill.active { background: var(--ok); } .pill.leashed { background: var(--bad); }
  .reason { color: var(--bad); font-size: 13px; min-height: 1.5em; }
  .meter { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .meter div { height: 100%; background: var(--info); transition: width .4s; }
  .meter.hot div { background: var(--bad); }
  .small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  button { font: inherit; font-size: 13px; font-weight: 600; border-radius: 7px; padding: 6px 12px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.kill { color: var(--bad); border-color: var(--bad); }
  button.release { background: var(--ok); border-color: var(--ok); color: #fff; }
  h2 { font-size: 15px; margin: 32px 0 10px; }
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.d { white-space: normal; min-width: 260px; word-break: break-word; }
  .k { font-weight: 600; font-size: 12px; }
  .k.allowed { color: var(--ok); } .k.blocked, .k.tripped, .k.error { color: var(--bad); }
  .k.throttled { color: var(--warn); } .k.released, .k.otari { color: var(--info); }
  .notice { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; color: var(--muted); }
  code { background: var(--track); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Leash</h1>
    <span class="sub">A kill switch for AI agents, in front of Otari.</span>
    <span class="gw" id="gw"></span>
  </header>
  <div id="noauth" class="notice" hidden>Open the dashboard link Leash printed at startup. It ends in <code>#admin=…</code>.</div>
  <section class="grid" id="agents"></section>
  <h2>Audit trail</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Time</th><th>Agent</th><th>Event</th><th>Detail</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let token = "";
try { token = new URLSearchParams(location.hash.slice(1)).get("admin") || sessionStorage.getItem("leash-admin") || ""; } catch (e) {}
try { if (token) sessionStorage.setItem("leash-admin", token); } catch (e) {}

async function api(path, method) {
  const r = await fetch(path, { method: method || "GET", headers: { "X-Leash-Admin": token } });
  if (r.status === 401) { $("noauth").hidden = false; throw new Error("unauthorized"); }
  return r.json();
}

async function act(name, what) { await api("/api/agents/" + encodeURIComponent(name) + "/" + what, "POST"); tick(); }

function card(a) {
  const pct = Math.min(100, a.max_usd ? 100 * a.spent_usd / a.max_usd : 0);
  const gw = a.otari_disabled ? " · Otari key disabled" : "";
  const remaining = a.otari_remaining_usd != null ? " · Otari budget left $" + Number(a.otari_remaining_usd).toFixed(4) : "";
  return '<div class="card ' + a.status + '">' +
    '<div class="row"><span class="name">' + esc(a.name) + '</span><span class="pill ' + a.status + '">' + a.status + '</span></div>' +
    '<div class="reason">' + esc(a.reason || "") + '</div>' +
    '<div class="meter' + (pct >= 100 ? " hot" : "") + '"><div style="width:' + pct + '%"></div></div>' +
    '<div class="small">$' + a.spent_usd.toFixed(4) + ' of $' + a.max_usd.toFixed(2) + ' · ' + a.requests + ' requests · ' + a.blocked + ' blocked</div>' +
    '<div class="small">loop after ' + a.loop_threshold + ' repeats · ' + a.max_rpm + '/min' +
      (a.allowed_tools ? ' · tools: ' + esc(a.allowed_tools.join(", ")) : '') + esc(remaining) + esc(gw) + '</div>' +
    '<div class="row">' + (a.status === "leashed"
      ? '<button class="release" data-a="' + esc(a.name) + '" data-do="release">Release</button>'
      : '<button class="kill" data-a="' + esc(a.name) + '" data-do="kill">Kill</button>') + '</div></div>';
}

async function tick() {
  let s;
  try { s = await api("/api/state"); } catch (e) { return; }
  $("noauth").hidden = true;
  $("gw").textContent = "Otari: " + s.otari_url + (s.gateway_control ? " · gateway key control on" : " · gateway key control off");
  $("agents").innerHTML = s.agents.map(card).join("");
  $("events").innerHTML = s.events.length ? s.events.map(e =>
    "<tr><td>" + new Date(e.t * 1000).toLocaleTimeString() + "</td><td>" + esc(e.agent) + "</td>" +
    '<td><span class="k ' + esc(e.kind) + '">' + esc(e.kind) + "</span></td>" +
    '<td class="d">' + esc(e.detail) + (e.args ? "<br><span class=small>" + esc(e.args) + "</span>" : "") + "</td></tr>").join("")
    : '<tr><td colspan="4" class="small">No activity yet. Run demo.py or point an agent at /v1.</td></tr>';
}

$("agents").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]");
  if (b) act(b.dataset.a, b.dataset.do);
});
if (!token) $("noauth").hidden = false;
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
